<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار قناة الجنوب الفضائية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:#fff;font-family:Tahoma,Arial,sans-serif}
a{color:inherit;text-decoration:none}
header{background:linear-gradient(120deg,#071426,#173653);padding:15px;border-bottom:3px solid #c92332}
.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:15px}
.logo{width:110px;height:65px;object-fit:contain}
.brand h1{font-size:22px;margin:0 0 7px}
.brand p{margin:0;color:#e6bd62}
nav{background:#102945;padding:13px;text-align:center;position:sticky;top:0;z-index:5}
nav a{display:inline-block;margin:5px 10px;font-size:14px;color:#e8edf4}
nav a:hover{color:#ff6974}
.container{max-width:1100px;margin:auto;padding:22px 15px}
.heading{border-right:4px solid #c92332;padding-right:13px;margin-bottom:22px}
.heading h2{margin:0 0 8px;font-size:25px}
.heading p{color:#bdcada;margin:0;line-height:1.8}
.news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.news-card{background:#10243c;border:1px solid #294766;border-radius:10px;overflow:hidden;transition:.2s}
.news-card:hover{transform:translateY(-4px);border-color:#c92332}
.news-card img{width:100%;height:190px;object-fit:cover;display:block;background:#172d43}
.news-body{padding:15px}
.news-body small{color:#e6bd62}
.news-body h3{font-size:18px;line-height:1.7;margin:9px 0}
.news-body p{font-size:14px;line-height:1.9;color:#c3cfdd;white-space:pre-line}
.read-more{display:inline-block;background:#c92332;padding:9px 14px;border-radius:5px;margin-top:8px;font-size:13px}
.state{background:#10243c;border:1px solid #294766;padding:20px;border-radius:9px;text-align:center;line-height:1.9;color:#d3deea}
footer{background:#030a13;text-align:center;padding:25px;margin-top:40px;color:#aab8c8;line-height:2}
footer img{width:120px;height:60px;object-fit:contain}
@media(max-width:750px){.news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.news-grid{grid-template-columns:1fr}.news-card img{height:210px}.header-inner{flex-wrap:wrap;justify-content:center;text-align:center}.brand h1{font-size:19px}}
</style>
</head>
<body>

<header>
 <div class="header-inner">
  <img class="logo" src="file_00000000184c81f483d7052251612c2a.png" alt="شعار قناة الجنوب">
  <div class="brand">
   <h1>قناة الجنوب الفضائية</h1>
   <p>صوت شعب الجنوب</p>
  </div>
 </div>
</header>

<nav>
 <a href="index.html">الرئيسية</a>
 <a href="live.html">البث المباشر</a>
 <a href="news.html">الأخبار</a>
 <a href="programs.html">البرامج</a>
 <a href="videos.html">الفيديوهات</a>
 <a href="about.html">عن القناة</a>
</nav>

<main class="container">
 <div class="heading">
  <h2>آخر الأخبار</h2>
  <p>تابع أخبار وتغطيات وتقارير قناة الجنوب الفضائية.</p>
 </div>

 <div id="newsList" class="news-grid">
  <div class="state">جارٍ تحميل الأخبار...</div>
 </div>
</main>

<footer>
 <img src="file_00000000184c81f483d7052251612c2a.png" alt="شعار القناة">
 <div><strong>قناة الجنوب الفضائية</strong></div>
 <div>صوت شعب الجنوب</div>
 <div>جميع الحقوق محفوظة © 2026</div>
</footer>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore, collection, getDocs, query, where, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCPdzH9CCUgzrF1x8ttxRVWHMjyXObs8yM",
 authDomain: "janoob-tv.firebaseapp.com",
 projectId: "janoob-tv",
 storageBucket: "janoob-tv.firebasestorage.app",
 messagingSenderId: "53846628655",
 appId: "1:53846628655:web:2300300cfb13b9f2f469da",
 measurementId: "G-2MY4E62F7R"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const list = document.getElementById("newsList");

function safeText(value=""){
 return String(value).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function safeUrl(value=""){
 try{
  const url = new URL(value);
  return url.protocol === "https:" ? url.href : "";
 }catch{
  return "";
 }
}

function dateText(timestamp){
 if(!timestamp || !timestamp.toDate) return "";
 return timestamp.toDate().toLocaleDateString("ar",{year:"numeric",month:"long",day:"numeric"});
}

async function loadNews(){
 try{
  const newsQuery = query(
   collection(db,"news"),
   where("published","==",true),
   orderBy("createdAt","desc")
  );

  const snapshot = await getDocs(newsQuery);

  if(snapshot.empty){
   list.innerHTML = '<div class="state">لا توجد أخبار منشورة حالياً. تابعونا قريباً.</div>';
   return;
  }

  list.innerHTML = "";

  snapshot.forEach(document => {
   const item = document.data();
   const image = safeUrl(item.imageUrl || "");
   const link = safeUrl(item.url || "");
   const article = document.createElement("article");
   article.className = "news-card";

   article.innerHTML = `
    ${image ? `<img src="${safeText(image)}" alt="${safeText(item.title || "خبر")}" loading="lazy">` : ""}
    <div class="news-body">
     <small>${dateText(item.createdAt)}</small>
     <h3>${safeText(item.title || "خبر من قناة الجنوب")}</h3>
     <p>${safeText(item.description || "")}</p>
     ${link ? `<a class="read-more" href="${safeText(link)}" target="_blank" rel="noopener noreferrer">التفاصيل</a>` : ""}
    </div>
   `;

   list.appendChild(article);
  });

 }catch(error){
  console.error("News loading error:",error);
  list.innerHTML = '<div class="state">تعذر تحميل الأخبار. يرجى المحاولة لاحقاً.</div>';
 }
}

loadNews();
</script>

</body>
 </html>
