
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البث المباشر | قناة الجنوب الفضائية</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101c27;
 color:white;
 font-family:Tahoma,Arial,sans-serif;
}
header{
 background:#102b40;
 padding:22px 12px;
 text-align:center;
 border-bottom:3px solid #d92332;
}
header h1{margin:0;font-size:25px}
header p{margin:9px 0 0;color:#dce7ed}
nav{
 background:#172f41;
 padding:15px;
 text-align:center;
}
nav a{
 color:white;
 text-decoration:none;
 margin:0 12px;
 font-size:14px;
}
main{
 max-width:1100px;
 margin:30px auto;
 padding:15px;
}
.heading{text-align:center;margin:25px 0}
.heading h2{font-size:27px}
.live-label{
 display:inline-block;
 background:#d92332;
 padding:7px 16px;
 border-radius:5px;
 font-size:13px;
 margin-bottom:15px;
}
.player{
 background:#000;
 border:2px solid #29485c;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 8px 25px #0005;
}
video{
 width:100%;
 display:block;
 aspect-ratio:16/9;
 background:#000;
}
.message{
 text-align:center;
 color:#bdcbd5;
 font-size:13px;
 margin-top:15px;
}
footer{
 text-align:center;
 background:#091722;
 padding:22px;
 color:#b7c8d3;
 margin-top:50px;
}
@media(max-width:600px){
 header h1{font-size:21px}
 nav a{display:inline-block;margin:7px}
 .heading h2{font-size:22px}
}
</style>
</head>
<body>

<header>
 <h1>قناة الجنوب الفضائية</h1>
 <p>صوت شعب الجنوب</p>
</header>

<nav>
 <a href="index.html">الرئيسية</a>
 <a href="live.html">البث المباشر</a>
 <a href="news.html">الأخبار</a>
 <a href="programs.html">البرامج</a>
</nav>

<main>
 <div class="heading">
  <div class="live-label">● البث المباشر</div>
  <h2>مشاهدة قناة الجنوب الفضائية</h2>
 </div>

 <div class="player">
  <video id="video" controls playsinline
   preload="metadata"></video>
 </div>

 <div class="message" id="status">
  البث التجريبي لقناة الجنوب الفضائية
 </div>
</main>

<footer>
 جميع الحقوق محفوظة © قناة الجنوب الفضائية
 <br>صوت شعب الجنوب
</footer>

<script>
const STREAM_URL =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

const video = document.getElementById("video");
const statusBox = document.getElementById("status");

if(Hls.isSupported()){
 const hls = new Hls();
 hls.loadSource(STREAM_URL);
 hls.attachMedia(video);

 hls.on(Hls.Events.MANIFEST_PARSED,()=>{
  statusBox.textContent = "البث جاهز للمشاهدة";
 });

 hls.on(Hls.Events.ERROR,(event,data)=>{
  if(data.fatal){
   statusBox.textContent =
   "تعذر الاتصال بالبث التجريبي حالياً";
  }
 });
}else if(video.canPlayType("application/vnd.apple.mpegurl")){
 video.src = STREAM_URL;
}else{
 statusBox.textContent = "المتصفح لا يدعم تشغيل هذا البث";
}
</script>

</body>
</html>
